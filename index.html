<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Findiva — Your next favorite, somewhere in here.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="header">
    <div class="logo">
      <span>Findiva</span>
    </div>

    <nav class="lang-switch" id="langSwitch" aria-label="Language options">
      <button class="lang-btn" type="button" data-lang="ja">日本語</button>
      <button class="lang-btn active" type="button" data-lang="en">EN</button>
      <button class="lang-btn" type="button" data-lang="id">ID</button>
    </nav>
  </header>

  <main class="main">

    <section class="hero">
      <p class="hero-label" data-i18n="label"></p>
      <h1 class="hero-title" data-i18n="title"></h1>
      <p class="hero-sub" data-i18n="sub"></p>
    </section>

    <section class="input-section">
      <div id="inputsList">
        <div class="input-row">
          <div class="input-wrap">
            <span class="input-num">01</span>
            <input type="text" class="artistField" autocomplete="off" spellcheck="false" data-i18n-placeholder="placeholder">
          </div>
        </div>
        <div class="input-row">
          <div class="input-wrap">
            <span class="input-num">02</span>
            <input type="text" class="artistField" autocomplete="off" spellcheck="false" data-i18n-placeholder="placeholder">
          </div>
        </div>
        <div class="input-row">
          <div class="input-wrap">
            <span class="input-num">03</span>
            <input type="text" class="artistField" autocomplete="off" spellcheck="false" data-i18n-placeholder="placeholder">
          </div>
        </div>
      </div>

      <div class="input-actions">
        <button id="addBtn" class="add-btn" type="button">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span data-i18n="addArtist"></span>
        </button>
        <span class="input-hint" data-i18n="upTo"></span>
      </div>

      <button id="discoverBtn" type="button">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <path d="M7.5 1a6.5 6.5 0 100 13A6.5 6.5 0 007.5 1zM5.5 5l4 2.5-4 2.5V5z" fill="currentColor"/>
        </svg>
        <span data-i18n="findBtn"></span>
      </button>
    </section>

    <div id="loading" class="loading hidden" aria-live="polite">
      <div class="loading-dots"><span></span><span></span><span></span></div>
      <p id="loadingText"></p>
    </div>

    <section id="results" class="results hidden" aria-live="polite">
      <div class="results-header">
        <h2 class="results-title" data-i18n="resultsTitle"></h2>
        <p class="results-sub" id="resultsSub"></p>
      </div>
      <div class="cards-grid" id="cardsGrid"></div>
    </section>

    <div id="errorMsg" class="error hidden" role="alert"></div>

  </main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
