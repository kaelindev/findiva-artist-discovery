<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Findiva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="header">
    <div class="logo">
      <span>Findiva</span>
    </div>

    <div class="lang-dropdown-wrap">
      <button class="lang-btn" id="langBtn">
        <span id="langCurrent">🇬🇧 EN</span>
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="lang-menu" id="langMenu">
        <button class="lang-option active" data-lang="en">🇬🇧 <span>EN</span></button>
        <button class="lang-option" data-lang="id">🇮🇩 <span>ID</span></button>
        <button class="lang-option" data-lang="ja">🇯🇵 <span>JP</span></button>
      </div>
    </div>
  </header>

  <main class="main">

    <section class="hero">
      <p class="hero-label" data-i18n="label"></p>
      <h1 class="hero-title" data-i18n="title"></h1>
      <p class="hero-sub" data-i18n="sub"></p>
    </section>

    <section class="input-section">
      <div id="inputsList">
        <div class="input-row">
          <div class="input-wrap">
            <span class="input-num">01</span>
            <input type="text" class="artistField" autocomplete="off" spellcheck="false" data-i18n-placeholder="placeholder">
          </div>
        </div>
        <div class="input-row">
          <div class="input-wrap">
            <span class="input-num">02</span>
            <input type="text" class="artistField" autocomplete="off" spellcheck="false" data-i18n-placeholder="placeholder">
          </div>
        </div>
        <div class="input-row">
          <div class="input-wrap">
            <span class="input-num">03</span>
            <input type="text" class="artistField" autocomplete="off" spellcheck="false" data-i18n-placeholder="placeholder">
          </div>
        </div>
      </div>

      <div class="input-actions">
        <button id="addBtn" class="add-btn">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span data-i18n="addArtist"></span>
        </button>
        <span class="input-hint" data-i18n="upTo"></span>
      </div>

      <button id="discoverBtn">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <path d="M7.5 1a6.5 6.5 0 100 13A6.5 6.5 0 007.5 1zM5.5 5l4 2.5-4 2.5V5z" fill="currentColor"/>
        </svg>
        <span data-i18n="findBtn"></span>
      </button>
    </section>

    <div id="loading" class="loading hidden">
      <div class="loading-dots"><span></span><span></span><span></span></div>
      <p id="loadingText"></p>
    </div>

    <section id="results" class="results hidden">
      <div class="results-header">
        <h2 class="results-title" data-i18n="resultsTitle"></h2>
        <p class="results-sub" id="resultsSub"></p>
      </div>
      <div class="cards-grid" id="cardsGrid"></div>
    </section>

    <div id="errorMsg" class="error hidden"></div>

  </main>
</div>

<script src="script.js"></script>
</body>
</html>
